name: Build Oi Toto APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-customer-apk:
    name: Build Passenger App APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Prepare Android Platform & Dependencies
        run: |
          cd apps/customer_app
          # 1. Backup real Oi Toto code, assets and res
          cp -r lib /tmp/cust_lib_backup
          cp -r assets /tmp/cust_assets_backup 2>/dev/null || true
          cp -r android/app/src/main/res /tmp/cust_res_backup 2>/dev/null || true
          cp pubspec.yaml /tmp/cust_pubspec_backup.yaml

          # 2. Generate android build wrappers
          flutter create . --project-name oi_toto_customer --org in.oitoto --platforms=android --overwrite

          # 3. Restore real Oi Toto application code, assets and custom launcher icons
          rm -rf lib .dart_tool pubspec.lock
          cp -r /tmp/cust_lib_backup lib
          cp -r /tmp/cust_assets_backup assets 2>/dev/null || true
          cp -r /tmp/cust_res_backup/* android/app/src/main/res/ 2>/dev/null || true
          cp /tmp/cust_pubspec_backup.yaml pubspec.yaml

          # 4. Inject Android permissions, app label, multidex, and Kotlin 1.9.22
          python3 ../../scripts/prepare_android.py customer

          # 5. Get packages fresh
          flutter pub get
          flutter analyze --no-fatal-infos || true

      - name: Build Real Customer Release APK
        run: |
          cd apps/customer_app
          flutter build apk --release --no-tree-shake-icons || (flutter build apk --release --no-tree-shake-icons -v 2>&1 | tail -n 150; exit 1)

      - name: Upload Passenger Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: oi_toto_customer_apk
          path: apps/customer_app/build/app/outputs/flutter-apk/app-release.apk

  build-driver-apk:
    name: Build Driver Partner App APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Prepare Android Platform & Dependencies
        run: |
          cd apps/driver_app
          # 1. Backup real Oi Toto code, assets and res
          cp -r lib /tmp/driver_lib_backup
          cp -r assets /tmp/driver_assets_backup 2>/dev/null || true
          cp -r android/app/src/main/res /tmp/driver_res_backup 2>/dev/null || true
          cp pubspec.yaml /tmp/driver_pubspec_backup.yaml

          # 2. Generate android build wrappers
          flutter create . --project-name oi_toto_driver --org in.oitoto --platforms=android --overwrite

          # 3. Restore real Oi Toto application code, assets and custom launcher icons
          rm -rf lib .dart_tool pubspec.lock
          cp -r /tmp/driver_lib_backup lib
          cp -r /tmp/driver_assets_backup assets 2>/dev/null || true
          cp -r /tmp/driver_res_backup/* android/app/src/main/res/ 2>/dev/null || true
          cp /tmp/driver_pubspec_backup.yaml pubspec.yaml

          # 4. Inject Android permissions, app label, multidex, and Kotlin 1.9.22
          python3 ../../scripts/prepare_android.py driver

          # 5. Get packages fresh
          flutter pub get
          flutter analyze --no-fatal-infos || true

      - name: Build Real Driver Release APK
        run: |
          cd apps/driver_app
          flutter build apk --release --no-tree-shake-icons || (flutter build apk --release --no-tree-shake-icons -v 2>&1 | tail -n 150; exit 1)

      - name: Upload Driver Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: oi_toto_driver_apk
          path: apps/driver_app/build/app/outputs/flutter-apk/app-release.apk

  publish-release:
    name: Publish Release v1.0.7
    needs: [build-customer-apk, build-driver-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Customer APK
        uses: actions/download-artifact@v4
        with:
          name: oi_toto_customer_apk
          path: ./artifacts_customer

      - name: Download Driver APK
        uses: actions/download-artifact@v4
        with:
          name: oi_toto_driver_apk
          path: ./artifacts_driver

      - name: Rename APKs
        run: |
          mkdir -p ./release_files
          cp ./artifacts_customer/app-release.apk ./release_files/OiToto_Customer_v1.0.7.apk
          cp ./artifacts_driver/app-release.apk ./release_files/OiToto_Driver_v1.0.7.apk
          cp ./artifacts_customer/app-release.apk ./release_files/oi_toto_customer.apk
          cp ./artifacts_driver/app-release.apk ./release_files/oi_toto_driver.apk

      - name: Upload APKs to GitHub Release v1.0.7
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: Oi Toto Release v1.0.7
          body: |
            ## 🛺 Oi Toto! v1.0.7 Release
            - **Strict Shortest Path Selection:** Automatic shortest road choice between Highway & PMG/Pocket roads (direct Samsi-Kandaran shortcut ~570m).
            - **Slender Needle Drop Pin ("Soru Needle Pin"):** Precision needle shaft with 3D ground shadow.
            - **Zone Corridors:** Real-time auto detection of regional hubs (Samsi & Chanchal).
            - **Visible v1.0.7 Badge:** In-app version tag to confirm active build.
          files: |
            ./release_files/OiToto_Customer_v1.0.7.apk
            ./release_files/OiToto_Driver_v1.0.7.apk
            ./release_files/oi_toto_customer.apk
            ./release_files/oi_toto_driver.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
