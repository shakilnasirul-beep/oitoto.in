name: Build Oi Toto APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-customer-apk:
    name: Build Passenger App APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Prepare Android Platform & Dependencies
        run: |
          cd apps/customer_app
          # 1. Backup real Oi Toto code and dependencies
          cp -r lib /tmp/cust_lib_backup
          cp -r assets /tmp/cust_assets_backup 2>/dev/null || true
          cp pubspec.yaml /tmp/cust_pubspec_backup.yaml

          # 2. Generate android build wrappers
          flutter create . --project-name oi_toto_customer --org in.oitoto --platforms=android --overwrite

          # 3. Restore real Oi Toto application code
          rm -rf lib .dart_tool pubspec.lock
          cp -r /tmp/cust_lib_backup lib
          cp -r /tmp/cust_assets_backup assets 2>/dev/null || true
          cp /tmp/cust_pubspec_backup.yaml pubspec.yaml

          # 4. Inject Android permissions and multidex
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          c = open(p).read()
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>
              <uses-permission android:name=\"android.permission.CALL_PHONE\"/>
              <uses-permission android:name=\"android.permission.VIBRATE\"/>
          '''
          c = c.replace('<application', perms + '    <application android:usesCleartextTraffic=\"true\"')
          open(p, 'w').write(c)

          bg = 'android/app/build.gradle'
          bg_c = open(bg).read()
          bg_c = bg_c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
          bg_c = bg_c.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')
          open(bg, 'w').write(bg_c)
          "

          # 5. Get packages fresh
          flutter pub get
          flutter analyze --no-fatal-infos || true

      - name: Build Real Customer Release APK
        run: |
          cd apps/customer_app
          flutter build apk --release --no-tree-shake-icons || (flutter build apk --release --no-tree-shake-icons -v 2>&1 | tail -n 150; exit 1)

      - name: Upload Passenger Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: oi_toto_customer_apk
          path: apps/customer_app/build/app/outputs/flutter-apk/app-release.apk

  build-driver-apk:
