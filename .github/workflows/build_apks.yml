name: Build Oi Toto APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-customer-apk:
    name: Build Passenger App APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Android Platform & Apply Permissions
        run: |
          cd apps/customer_app
          flutter create . --project-name oi_toto_customer --org in.oitoto --platforms=android --overwrite
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          c = open(p).read()
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>
              <uses-permission android:name=\"android.permission.CALL_PHONE\"/>
              <uses-permission android:name=\"android.permission.VIBRATE\"/>
          '''
          c = c.replace('<application', perms + '    <application android:usesCleartextTraffic=\"true\"')
          open(p, 'w').write(c)
          "
          flutter pub get

      - name: Build Customer Release APK
        run: |
          cd apps/customer_app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Passenger Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: oi_toto_customer_apk
          path: apps/customer_app/build/app/outputs/flutter-apk/app-release.apk

  build-driver-apk:
    name: Build Driver Partner App APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Android Platform & Apply Permissions
        run: |
          cd apps/driver_app
          flutter create . --project-name oi_toto_driver --org in.oitoto --platforms=android --overwrite
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          c = open(p).read()
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>
              <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>
              <uses-permission android:name=\"android.permission.VIBRATE\"/>
              <uses-permission android:name=\"android.permission.CALL_PHONE\"/>
              <uses-permission android:name=\"android.permission.CAMERA\"/>
          '''
          c = c.replace('<application', perms + '    <application android:usesCleartextTraffic=\"true\"')
          open(p, 'w').write(c)
          "
          flutter pub get

      - name: Build Driver Release APK
        run: |
          cd apps/driver_app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Driver Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: oi_toto_driver_apk
          path: apps/driver_app/build/app/outputs/flutter-apk/app-release.apk
