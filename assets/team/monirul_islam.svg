<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCEO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49" />
      <stop offset="60%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="auraCEO" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#082F49" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="200" fill="url(#bgGradCEO)" />
  <rect width="400" height="400" rx="200" fill="url(#auraCEO)" />

  <!-- Outer Ring Accent -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="14 6" opacity="0.8" />
  <circle cx="200" cy="200" r="182" fill="none" stroke="#FDE047" stroke-width="1.5" opacity="0.4" />

  <!-- Electrical / EV Circuit Nodes -->
  <circle cx="90" cy="140" r="4" fill="#38BDF8" />
  <line x1="90" y1="140" x2="120" y2="170" stroke="#38BDF8" stroke-width="1.5" opacity="0.5" />
  <circle cx="310" cy="140" r="4" fill="#38BDF8" />
  <line x1="310" y1="140" x2="280" y2="170" stroke="#38BDF8" stroke-width="1.5" opacity="0.5" />

  <!-- Executive Engineer Graphic -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Head -->
    <circle cx="200" cy="140" r="54" fill="#FFFFFF" />
    
    <!-- Lightning Bolt Icon on Chest -->
    <path d="M100 340 C100 250, 140 220, 200 220 C260 220, 300 250, 300 340 Z" fill="#E0F2FE" />
    <!-- Lapels -->
    <polygon points="175,220 200,310 185,340 160,260" fill="#BAE6FD" opacity="0.8" />
    <polygon points="225,220 200,310 215,340 240,260" fill="#7DD3FC" opacity="0.8" />

    <!-- Electric Engineering Lightning Symbol -->
    <polygon points="204,230 190,265 204,265 196,305 216,260 202,260" fill="url(#electricGrad)" />
  </g>

  <!-- Monogram Badge -->
  <g transform="translate(200, 345)">
    <rect x="-60" y="-22" width="120" height="40" rx="20" fill="#082F49" stroke="url(#cyanGrad)" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#E0F2FE" text-anchor="middle" letter-spacing="1">CEO</text>
  </g>
</svg>