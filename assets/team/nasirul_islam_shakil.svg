<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="techCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <radialGradient id="auraDev" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="200" fill="url(#bgGradDev)" />
  <rect width="400" height="400" rx="200" fill="url(#auraDev)" />

  <!-- Outer Ring Accent -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#neonViolet)" stroke-width="4" stroke-dasharray="8 8" opacity="0.8" />
  <circle cx="200" cy="200" r="182" fill="none" stroke="url(#techCyan)" stroke-width="1.5" opacity="0.5" />

  <!-- Code Bracket Accents -->
  <text x="70" y="150" font-family="'Space Grotesk', monospace" font-size="36" font-weight="800" fill="#818CF8" opacity="0.5">&lt;/&gt;</text>
  <text x="290" y="150" font-family="'Space Grotesk', monospace" font-size="36" font-weight="800" fill="#818CF8" opacity="0.5">{ ; }</text>

  <!-- Developer Silhouette Graphic -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Head -->
    <circle cx="200" cy="140" r="54" fill="#FFFFFF" />
    <!-- Modern Tech Glasses -->
    <rect x="165" y="130" width="30" height="16" rx="5" fill="none" stroke="#6366F1" stroke-width="3.5" />
    <rect x="205" y="130" width="30" height="16" rx="5" fill="none" stroke="#6366F1" stroke-width="3.5" />
    <line x1="195" y1="138" x2="205" y2="138" stroke="#6366F1" stroke-width="3" />

    <!-- Modern Blazer & Tech Hoodie -->
    <path d="M100 340 C100 250, 140 220, 200 220 C260 220, 300 250, 300 340 Z" fill="#EEF2FF" />
    <polygon points="175,220 200,310 185,340 160,260" fill="#C7D2FE" opacity="0.8" />
    <polygon points="225,220 200,310 215,340 240,260" fill="#A5B4FC" opacity="0.8" />

    <!-- Terminal Code Glyph on Chest -->
    <circle cx="200" cy="270" r="20" fill="#1E1B4B" />
    <path d="M194 264 L199 269 L194 274" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="202" y1="274" x2="208" y2="274" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Monogram Badge -->
  <g transform="translate(200, 345)">
    <rect x="-70" y="-22" width="140" height="40" rx="20" fill="#1E1B4B" stroke="url(#neonViolet)" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#E0E7FF" text-anchor="middle" letter-spacing="1">ARCHITECT</text>
  </g>
</svg>